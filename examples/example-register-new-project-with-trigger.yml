---
# =============================================================================
# HOW TO REGISTER A NEW PROJECT
# =============================================================================
# 1. Copy this file, rename it to your project (e.g. my-api-trigger.yml)
# 2. Replace all placeholder values marked with <CHANGE_ME>
# 3. Create required secrets (see Secret section at bottom)
# 4. Apply: kubectl apply -f my-api-trigger.yml -n tekton-ci
# 5. Attach the Trigger to the EventListener by adding this entry to
#    spec.triggers of triggers/event-listener-webhook-github-gitlab-bitbucket-gitea.yml:
#      - triggerRef: my-api-trigger
# 6. Expose the Service el-git-webhook-listener (port 8080) through an Ingress with TLS and
#    point your Git provider webhook at it with Content-Type: application/json and your
#    webhook secret.
# =============================================================================

# -----------------------------------------------------------------------------
# Trigger — one per project, attached to the EventListener with triggerRef. It
# verifies the webhook, filters on this repository and supplies the project's
# image registry and deploy settings to the TriggerTemplate.
# -----------------------------------------------------------------------------
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: my-api-trigger
  namespace: tekton-ci
  labels:
    app.kubernetes.io/part-of: auto-pipeline
    project: my-api
spec:
  # Verify the GitHub signature, then accept only pushes to main of this one repository.
  # Adjust the CEL filter to trigger on other branches.
  interceptors:
    - ref:
        name: github
        kind: ClusterInterceptor
      params:
        - name: secretRef
          value:
            secretName: github-webhook-secret
            secretKey: secret
        - name: eventTypes
          value: ["push"]
    - ref:
        name: cel
        kind: ClusterInterceptor
      params:
        - name: filter
          value: "body.repository.clone_url == 'https://github.com/<CHANGE_ME>/my-api.git' && body.ref == 'refs/heads/main'"

  bindings:
    # Use the binding that matches your Git provider:
    #   git-webhook-binding-github
    #   git-webhook-binding-gitlab
    #   git-webhook-binding-bitbucket
    #   git-webhook-binding-gitea
    - ref: git-webhook-binding-github
    - ref: pipeline-defaults

  template:
    ref: auto-pipeline-trigger-template
    params:
      # --- Git ---
      - name: git-repo-name
        value: my-api

      # --- Docker image to build and push ---
      # The image is <image-repository>/<git-repo-name>:<commit sha> (immutable tag).
      - name: image-repository
        value: ghcr.io/<CHANGE_ME>

      # --- Deploy target ---
      # Options: ssh-build | docker-compose | k8s | helm | s3-cloudfront | rsync | skip
      - name: deploy-target
        value: docker-compose   # <CHANGE_ME>

      # --- SSH / docker-compose deploy params (remove if not using) ---
      - name: ssh-host
        value: "203.0.113.10"   # <CHANGE_ME>
      - name: ssh-user
        value: "deploy"
      - name: ssh-port
        value: "22"
      - name: remote-dir
        value: "/opt/my-api"
      - name: compose-file
        value: "docker-compose.yml"
      - name: compose-service
        value: "api"

      # --- k8s deploy params (uncomment if deploy-target: k8s) ---
      # - name: k8s-namespace
      #   value: "production"
      # - name: k8s-deployment
      #   value: "my-api"
      # - name: k8s-container
      #   value: "api"

      # --- helm deploy params (uncomment if deploy-target: helm) ---
      # - name: helm-release
      #   value: "my-api"
      # - name: helm-chart
      #   value: "./chart"
      # - name: helm-namespace
      #   value: "production"
      # - name: helm-values-file
      #   value: "values.production.yaml"

      # --- s3-cloudfront params (uncomment if deploy-target: s3-cloudfront) ---
      # - name: s3-bucket
      #   value: "my-frontend-bucket"
      # - name: s3-source-path
      #   value: "dist"
      # - name: cloudfront-distribution-id
      #   value: "EXXXXXXXXXX"
      # - name: aws-region
      #   value: "us-east-1"

      # --- rsync params (uncomment if deploy-target: rsync) ---
      # - name: rsync-source-path
      #   value: "dist"

      # --- Workspace / secret bindings ---
      - name: source-storage
        value: 2Gi
      - name: docker-credentials-secret
        value: my-api-docker-secret     # <CHANGE_ME> — see secret below
      - name: ssh-credentials-secret
        value: my-api-ssh-secret        # <CHANGE_ME> — see secret below

      # --- Pipeline behaviour ---
      - name: skip-tests
        value: "false"
      - name: skip-push
        value: "false"

---
# =============================================================================
# REQUIRED SECRETS — create once per project, then reference by name above
# =============================================================================

# --- Docker registry credentials (a Docker config.json under the key config.json) ---
# kubectl create secret generic my-api-docker-secret \
#   --from-file=config.json=$HOME/.docker/config.json \
#   -n tekton-ci

# --- SSH deploy key plus the pinned server host key (check the keyscan output by hand) ---
# ssh-keyscan -p 22 <server> > known_hosts
# kubectl create secret generic my-api-ssh-secret \
#   --from-file=id_rsa=$HOME/.ssh/my-api-deploy-key \
#   --from-file=known_hosts=known_hosts \
#   -n tekton-ci

# --- GitHub webhook HMAC secret (shared with GitHub webhook config) ---
# kubectl create secret generic github-webhook-secret \
#   --from-literal=secret=<CHANGE_ME_RANDOM_SECRET> \
#   -n tekton-ci

# --- Bitbucket webhook secret ---
# kubectl create secret generic bitbucket-webhook-secret \
#   --from-literal=secret=<CHANGE_ME_BITBUCKET_SECRET> \
#   -n tekton-ci

# --- GitLab webhook token ---
# kubectl create secret generic gitlab-webhook-secret \
#   --from-literal=secret=<CHANGE_ME_GITLAB_TOKEN> \
#   -n tekton-ci

# --- Gitea webhook secret ---
# kubectl create secret generic gitea-webhook-secret \
#   --from-literal=secret=<CHANGE_ME_GITEA_SECRET> \
#   -n tekton-ci

# --- kubeconfig for k8s/helm deploy target ---
# kubectl create secret generic my-api-kubeconfig \
#   --from-file=config=$HOME/.kube/config \
#   -n tekton-ci

# --- AWS credentials for s3-cloudfront deploy target ---
# kubectl create secret generic my-api-aws-credentials \
#   --from-file=credentials=$HOME/.aws/credentials \
#   -n tekton-ci
