apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: git-webhook-listener
  labels:
    app.kubernetes.io/part-of: auto-pipeline
spec:
  serviceAccountName: tekton-triggers-sa
  resources:
    kubernetesResource:
      spec:
        template:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: 100m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
  triggers:
    # =========================================================================
    # GitHub — push events
    # Webhook secret verified via HMAC-SHA256 header X-Hub-Signature-256
    # =========================================================================
    - name: github-push
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              # Only trigger on branch pushes, ignore tag-only or delete events
              value: "body.ref.startsWith('refs/heads/') && body.after != '0000000000000000000000000000000000000000'"
            - name: overlays
              value:
                - key: git_revision
                  # body.ref = "refs/heads/feature/foo" — split('/')[2] yields only "feature".
                  # replace() strips the prefix correctly for branch names with slashes.
                  expression: "body.ref.replace('refs/heads/', '')"
      bindings:
        - ref: git-webhook-binding-github
        - ref: pipeline-defaults
      template:
        ref: auto-pipeline-trigger-template

    # =========================================================================
    # GitLab — push events
    # Webhook token verified via X-Gitlab-Token header
    # =========================================================================
    - name: gitlab-push
      interceptors:
        - ref:
            name: gitlab
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: gitlab-webhook-secret
                secretKey: secret
            - name: eventTypes
              value:
                - Push Hook
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: "body.ref.startsWith('refs/heads/') && body.after != '0000000000000000000000000000000000000000'"
            - name: overlays
              value:
                - key: git_revision
                  # body.ref = "refs/heads/feature/foo" — split('/')[2] yields only "feature".
                  # replace() strips the prefix correctly for branch names with slashes.
                  expression: "body.ref.replace('refs/heads/', '')"
      bindings:
        - ref: git-webhook-binding-gitlab
        - ref: pipeline-defaults
      template:
        ref: auto-pipeline-trigger-template

    # =========================================================================
    # Bitbucket — repo:push events
    # Authenticated like GitHub: the webhook secret signs the body (X-Hub-Signature)
    # and the bitbucket interceptor verifies it. Set the secret in the Bitbucket
    # webhook settings; an unsigned or wrongly signed request is rejected.
    # =========================================================================
    - name: bitbucket-push
      interceptors:
        - ref:
            name: bitbucket
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: bitbucket-webhook-secret
                secretKey: secret
            - name: eventTypes
              value:
                - repo:push
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              # Branch pushes only; a deleted branch has no "new" entry.
              value: "size(body.push.changes) > 0 && body.push.changes[0].new.type == 'branch'"
      bindings:
        - ref: git-webhook-binding-bitbucket
        - ref: pipeline-defaults
      template:
        ref: auto-pipeline-trigger-template

    # =========================================================================
    # Gitea — push events
    # Gitea signs the body with HMAC-SHA256 and also sends the GitHub-compatible
    # X-Hub-Signature-256 / X-GitHub-Event headers, which the github interceptor verifies.
    # =========================================================================
    - name: gitea-push
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: gitea-webhook-secret
                secretKey: secret
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: "body.ref.startsWith('refs/heads/') && body.after != '0000000000000000000000000000000000000000'"
            - name: overlays
              value:
                - key: git_revision
                  # body.ref = "refs/heads/feature/foo" — split('/')[2] yields only "feature".
                  # replace() strips the prefix correctly for branch names with slashes.
                  expression: "body.ref.replace('refs/heads/', '')"
      bindings:
        - ref: git-webhook-binding-gitea
        - ref: pipeline-defaults
      template:
        ref: auto-pipeline-trigger-template

---
# ServiceAccount the EventListener pod runs as. Permissions come from the two
# ClusterRoles that the Tekton Triggers release ships for exactly this purpose
# (read triggers/bindings/templates, create PipelineRuns, read secrets for the
# interceptors, read ClusterInterceptors). Nothing broader is granted here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  labels:
    app.kubernetes.io/part-of: auto-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-rolebinding
  labels:
    app.kubernetes.io/part-of: auto-pipeline
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-ci-triggers-clusterrolebinding
  labels:
    app.kubernetes.io/part-of: auto-pipeline
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
# No Service is declared here. The EventListener creates a ClusterIP Service named
# el-git-webhook-listener on port 8080. Publish it through an Ingress with TLS
# (cert-manager) instead of a plain-HTTP LoadBalancer.
