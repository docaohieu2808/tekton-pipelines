# Test infrastructure for the kind job: an OCI registry to push images to and a git
# server to clone fixtures from, both inside the cluster. Plain HTTP, no auth, for CI only.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: ghcr.io/distribution/distribution:3.1.2
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector: {app: registry}
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Namespace
metadata:
  name: git
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git
spec:
  replicas: 1
  selector:
    matchLabels: {app: git-server}
  template:
    metadata:
      labels: {app: git-server}
    spec:
      containers:
        - name: git-daemon
          image: alpine/git:v2.54.0
          args:
            - daemon
            - --reuseaddr
            - --base-path=/srv/git
            - --export-all
            - --enable=receive-pack
          ports:
            - containerPort: 9418
          readinessProbe:
            tcpSocket: {port: 9418}
          volumeMounts:
            - {name: repos, mountPath: /srv/git}
      volumes:
        - name: repos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git
spec:
  selector: {app: git-server}
  ports:
    - port: 9418
      targetPort: 9418
