# Tekton Chains configuration: sign the image the pipeline pushed with cosign and attach
# SLSA v1.0 provenance to it in the registry. Verified against Chains v0.29 (docs/config.md).
#
# SETUP
#   1. Install Chains (see README, scripts/install-tekton.sh).
#   2. Generate the signing key pair into the Secret Chains reads:
#        COSIGN_PASSWORD='' cosign generate-key-pair k8s://tekton-chains/signing-secrets
#      It creates Secret signing-secrets (cosign.key, cosign.pub, cosign.password).
#      Use a real password and keep cosign.pub for verification in production.
#   3. Apply this ConfigMap:
#        kubectl apply -f chains/tekton-chains-slsa-cosign-oci-storage-config.yaml
#      The controller watches the ConfigMap; no restart is needed.
#
# WHAT GETS SIGNED
#   Chains looks for TaskRun/PipelineRun results named IMAGE_URL and IMAGE_DIGEST
#   (the build-image-buildah Task and auto-pipeline emit them). For each one it
#   signs the image and pushes the signature and the provenance next to it in the registry.
#
# CHECK A RUN WAS SIGNED
#   kubectl get taskrun <name> -o jsonpath='{.metadata.annotations.chains\.tekton\.dev/signed}'
#   # -> true
apiVersion: v1
kind: ConfigMap
metadata:
  name: chains-config
  namespace: tekton-chains
  labels:
    app.kubernetes.io/name: tekton-chains
    app.kubernetes.io/component: chains-config
    app.kubernetes.io/part-of: tekton-chains
data:
  # -- Image signatures -------------------------------------------------------
  # Store the cosign signature in the OCI registry, next to the image.
  artifacts.oci.storage: "oci"
  # The only valid value: cosign "simple signing" payload.
  artifacts.oci.format: "simplesigning"
  # x509 = the key pair in Secret signing-secrets. Alternatives: kms, none.
  artifacts.oci.signer: "x509"

  # -- TaskRun provenance -----------------------------------------------------
  # slsa/v2alpha3 = SLSA provenance v1.0 (predicate https://slsa.dev/provenance/v1).
  # Valid formats: in-toto, slsa/v1, slsa/v2alpha3, slsa/v2alpha4.
  artifacts.taskrun.format: "slsa/v2alpha3"
  # Keep the signed provenance on the TaskRun and push it to the registry as an attestation.
  artifacts.taskrun.storage: "tekton,oci"
  artifacts.taskrun.signer: "x509"

  # -- PipelineRun provenance -------------------------------------------------
  artifacts.pipelinerun.format: "slsa/v2alpha3"
  artifacts.pipelinerun.storage: "tekton,oci"
  artifacts.pipelinerun.signer: "x509"

  # -- Keyless signing --------------------------------------------------------
  # false = sign with the key pair above instead of Fulcio certificates.
  signers.x509.fulcio.enabled: "false"

  # -- Transparency log -------------------------------------------------------
  # "true" uploads signatures to the public Rekor log (https://rekor.sigstore.dev), which
  # publishes image names. Off here so a private or offline setup works; turn it on for
  # public images and verify with cosign without --insecure-ignore-tlog.
  transparency.enabled: "false"

  # -- Registry transport ------------------------------------------------------
  # Default (false) means HTTPS with certificate checks. Set "true" only for a throw-away
  # test registry that serves plain HTTP; the CI workflow does exactly that for its in-cluster registry.
  storage.oci.repository.insecure: "false"

  # -- Builder identity -------------------------------------------------------
  # Value of builder.id in the provenance. This is Chains' default; replace it with a URL
  # that identifies your own Tekton installation if you want to tell installations apart.
  builder.id: "https://tekton.dev/chains/v2"
