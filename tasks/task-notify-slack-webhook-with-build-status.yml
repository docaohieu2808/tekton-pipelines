apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: notify-slack-webhook
  labels:
    app.kubernetes.io/part-of: auto-pipeline
    app.kubernetes.io/version: "1.0"
spec:
  description: |
    Sends a formatted Slack notification via an incoming webhook URL.
    Accepts build status, message, channel, and contextual build info.
    The webhook URL is read from a Kubernetes Secret, never passed as a plain param,
    so it does not show up in the PipelineRun spec or logs. Typical use is as a `finally`
    task of a Pipeline; it is not wired into auto-pipeline because it needs your Secret.
  params:
    - name: webhook-url-secret
      description: Name of the Secret that holds the Slack incoming webhook URL
      type: string
    - name: webhook-url-secret-key
      description: Key inside that Secret
      type: string
      default: url
    - name: message
      description: Main notification message text
      type: string
    - name: status
      description: Build/pipeline status — success | failure | warning | info
      type: string
      default: info
    - name: channel
      description: "Slack channel to post to (e.g. #ci-alerts). Leave empty to use webhook default."
      type: string
      default: ""
    - name: pipeline-name
      description: Name of the Tekton pipeline that triggered this notification
      type: string
      default: ""
    - name: pipeline-run-name
      description: Name of the PipelineRun for deep-link context
      type: string
      default: ""
    - name: git-repo
      description: Git repository URL or name
      type: string
      default: ""
    - name: git-branch
      description: Git branch name
      type: string
      default: ""
    - name: git-commit
      description: Git commit SHA (short)
      type: string
      default: ""
    - name: author
      description: Commit author or triggering user
      type: string
      default: ""
    - name: dashboard-url
      description: "Base URL of Tekton Dashboard (e.g. https://tekton.example.com) for run links"
      type: string
      default: ""
  steps:
    - name: send-slack-notification
      image: alpine:3.24.3
      env:
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: $(params.webhook-url-secret)
              key: $(params.webhook-url-secret-key)
        - name: MESSAGE
          value: $(params.message)
        - name: STATUS
          value: $(params.status)
        - name: CHANNEL
          value: $(params.channel)
        - name: PIPELINE
          value: $(params.pipeline-name)
        - name: RUN_NAME
          value: $(params.pipeline-run-name)
        - name: GIT_REPO
          value: $(params.git-repo)
        - name: GIT_BRANCH
          value: $(params.git-branch)
        - name: GIT_COMMIT
          value: $(params.git-commit)
        - name: AUTHOR
          value: $(params.author)
        - name: DASHBOARD_URL
          value: $(params.dashboard-url)
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache curl jq >/dev/null

        case "$STATUS" in
          success) EMOJI=":white_check_mark:" ; COLOR="good"    ;;
          failure) EMOJI=":x:"               ; COLOR="danger"  ;;
          warning) EMOJI=":warning:"         ; COLOR="warning" ;;
          *)       EMOJI=":information_source:" ; COLOR="#439FE0" ;;
        esac
        TITLE="${EMOJI} ${STATUS} - ${PIPELINE:-Pipeline}"

        RUN_LINK=""
        if [ -n "$DASHBOARD_URL" ] && [ -n "$RUN_NAME" ]; then
          RUN_LINK="${DASHBOARD_URL}/#/pipelineruns/${RUN_NAME}"
        fi

        # jq builds the JSON, so quotes or newlines in any value cannot break the payload.
        PAYLOAD=$(jq -n \
          --arg channel "$CHANNEL" --arg title "$TITLE" --arg text "$MESSAGE" --arg color "$COLOR" \
          --arg repo "$GIT_REPO" --arg branch "$GIT_BRANCH" --arg commit "$GIT_COMMIT" \
          --arg author "$AUTHOR" --arg link "$RUN_LINK" --arg run "$RUN_NAME" \
          '{
            attachments: [{
              color: $color, title: $title, text: $text,
              fields: ([
                {title: "Repository", value: $repo,   short: true},
                {title: "Branch",     value: $branch, short: true},
                {title: "Commit",     value: $commit, short: true},
                {title: "Author",     value: $author, short: true},
                {title: "Pipeline Run", value: ("<" + $link + "|" + $run + ">"), short: false}
              ] | map(select(.value != "" and .value != "<|>"))),
              footer: "Tekton CI/CD",
              ts: (now | floor)
            }]
          } + (if $channel != "" then {channel: $channel} else {} end)')

        echo "==> Sending Slack notification (status=$STATUS channel=${CHANNEL:-webhook default})"
        HTTP_STATUS=$(curl -sS -o /tmp/slack-response.txt -w "%{http_code}" \
          -X POST -H "Content-Type: application/json" --data "$PAYLOAD" "$WEBHOOK_URL")
        RESPONSE=$(cat /tmp/slack-response.txt)
        echo "    HTTP status: $HTTP_STATUS  response: $RESPONSE"

        if [ "$HTTP_STATUS" != "200" ] || [ "$RESPONSE" != "ok" ]; then
          echo "ERROR: Slack webhook returned an unexpected response" >&2
          exit 1
        fi
        echo "==> Slack notification sent"
