apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-tests
  labels:
    app.kubernetes.io/part-of: auto-pipeline
spec:
  description: |
    Runs the test suite in the toolchain image chosen by the detect-language task.
    Supports: node (npm/yarn/pnpm), java (maven/gradle), go, python (pip/poetry),
    php (composer/phpunit), rust (cargo). A failing test fails the Task. JUnit XML is
    copied to the test-results workspace for maven, gradle, python and phpunit (go and
    cargo have no built-in JUnit output).
  params:
    - name: builder-image
      description: Image with the toolchain for the detected language (result of detect-language)
      type: string
    - name: language
      description: Language detected by detect-language task
      type: string
    - name: build-tool
      description: Build tool detected by detect-language task
      type: string
    - name: extra-test-args
      description: Additional arguments appended to the test command, one per array item
      type: array
      default: []
    - name: skip-tests
      description: Set to "true" to skip running tests
      type: string
      default: "false"
  workspaces:
    - name: source
      description: Workspace with cloned and built source code
    - name: test-results
      description: Optional workspace to write JUnit XML results
      optional: true
  results:
    - name: test-status
      description: Status of the test run (success or skipped; a failure fails the Task)
  steps:
    - name: test
      image: $(params.builder-image)
      workingDir: $(workspaces.source.path)
      env:
        - name: LANGUAGE
          value: $(params.language)
        - name: BUILD_TOOL
          value: $(params.build-tool)
        - name: SKIP
          value: $(params.skip-tests)
        - name: RESULTS_BOUND
          value: $(workspaces.test-results.bound)
        - name: RESULTS_DIR
          value: $(workspaces.test-results.path)
        - name: GOPATH
          value: /workspace/go
        - name: GOCACHE
          value: /workspace/go-cache
        - name: npm_config_cache
          value: /workspace/npm-cache
        - name: MAVEN_OPTS
          value: "-Dmaven.repo.local=/workspace/maven-cache"
      args: ["$(params.extra-test-args[*])"]
      script: |
        #!/bin/sh
        set -eu

        if [ "$SKIP" = "true" ]; then
          echo "==> Tests skipped by param skip-tests=true"
          printf 'skipped' > "$(results.test-status.path)"
          exit 0
        fi

        # Copy JUnit XML files found under $1 into the results workspace, if one is bound.
        collect() {
          if [ "$RESULTS_BOUND" = "true" ]; then
            find "$1" -name '*.xml' -exec cp {} "$RESULTS_DIR/" \;
          fi
        }

        echo "==> Running tests: language=$LANGUAGE build-tool=$BUILD_TOOL"

        # "$@" holds the extra args (one per array item).
        case "$LANGUAGE" in
          node)
            case "$BUILD_TOOL" in
              pnpm)
                npm install -g pnpm
                pnpm install --frozen-lockfile
                pnpm test "$@"
                ;;
              yarn)
                npm install -g yarn
                yarn install --frozen-lockfile
                yarn test "$@"
                ;;
              *)
                npm ci
                npm test -- "$@"
                ;;
            esac
            ;;

          java)
            case "$BUILD_TOOL" in
              gradle)
                if [ -f ./gradlew ]; then
                  sh ./gradlew test "$@"
                else
                  gradle test "$@"
                fi
                collect build/test-results/test
                ;;
              *)
                mvn --batch-mode test "$@"
                collect target/surefire-reports
                ;;
            esac
            ;;

          go)
            go test ./... "$@"
            ;;

          python)
            case "$BUILD_TOOL" in
              poetry)
                pip install poetry
                poetry install
                poetry run pytest --junitxml=/tmp/results.xml "$@"
                ;;
              *)
                if [ -f requirements.txt ]; then
                  pip install -r requirements.txt
                fi
                pip install pytest
                python -m pytest --junitxml=/tmp/results.xml "$@"
                ;;
            esac
            collect /tmp
            ;;

          php)
            composer install
            ./vendor/bin/phpunit --log-junit /tmp/results.xml "$@"
            collect /tmp
            ;;

          rust)
            cargo test "$@"
            ;;

          *)
            echo "ERROR: cannot test unknown language '$LANGUAGE'" >&2
            exit 1
            ;;
        esac

        echo "==> Tests passed"
        printf 'success' > "$(results.test-status.path)"
      computeResources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
