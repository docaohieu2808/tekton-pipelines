apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy
  labels:
    app.kubernetes.io/part-of: auto-pipeline
spec:
  description: |
    Deploys the application to one of multiple targets:
      - ssh-build:      SSH into server, pull image, rebuild
      - docker-compose: SSH into server, run docker compose up
      - k8s:            kubectl apply manifests or set image
      - helm:           helm upgrade --install
      - s3-cloudfront:  aws s3 sync + CloudFront invalidation
      - rsync:          rsync files to remote server over SSH
  params:
    - name: deploy-target
      description: "Deployment target: ssh-build | docker-compose | k8s | helm | s3-cloudfront | rsync"
      type: string

    - name: image
      description: Full Docker image reference (used by ssh-build, docker-compose, k8s, helm)
      type: string
      default: ""

    # --- SSH / rsync shared params ---
    - name: ssh-host
      description: SSH hostname or IP (used by ssh-build, docker-compose, rsync)
      type: string
      default: ""
    - name: ssh-user
      description: SSH username
      type: string
      default: "deploy"
    - name: ssh-port
      description: SSH port
      type: string
      default: "22"
    - name: remote-dir
      description: Remote working directory (used by ssh-build, docker-compose, rsync)
      type: string
      default: "/opt/app"

    # --- docker-compose params ---
    - name: compose-file
      description: Path to docker-compose file on remote server
      type: string
      default: "docker-compose.yml"
    - name: compose-service
      description: Service name in docker-compose to update
      type: string
      default: "app"

    # --- k8s params ---
    - name: k8s-namespace
      description: Kubernetes namespace to deploy into
      type: string
      default: "default"
    - name: k8s-deployment
      description: Kubernetes Deployment name to update image on (used when no manifests)
      type: string
      default: ""
    - name: k8s-container
      description: Container name inside the Deployment to update
      type: string
      default: "app"
    - name: k8s-manifests-path
      description: Path to k8s manifests directory within workspace (leave empty to use kubectl set image)
      type: string
      default: ""

    # --- helm params ---
    - name: helm-release
      description: Helm release name
      type: string
      default: "myapp"
    - name: helm-chart
      description: Helm chart path or OCI ref (e.g. ./chart or oci://registry/chart)
      type: string
      default: "./chart"
    - name: helm-namespace
      description: Kubernetes namespace for helm release
      type: string
      default: "default"
    - name: helm-values-file
      description: Path to values file within workspace
      type: string
      default: "values.yaml"
    - name: helm-extra-args
      description: Additional arguments passed to helm upgrade
      type: string
      default: ""

    # --- s3-cloudfront params ---
    - name: s3-bucket
      description: S3 bucket name (e.g. my-frontend-bucket)
      type: string
      default: ""
    - name: s3-source-path
      description: Local path within workspace to sync (e.g. dist or build)
      type: string
      default: "dist"
    - name: cloudfront-distribution-id
      description: CloudFront distribution ID for cache invalidation (leave empty to skip)
      type: string
      default: ""
    - name: aws-region
      description: AWS region
      type: string
      default: "us-east-1"

    # --- rsync params ---
    - name: rsync-source-path
      description: Local path within workspace to sync
      type: string
      default: "."
    - name: rsync-extra-args
      description: Extra rsync arguments
      type: string
      default: "--exclude=.git --exclude=node_modules"

  workspaces:
    - name: source
      description: Workspace with built application artifacts
    - name: ssh-credentials
      description: |
        Workspace with the SSH private key (file id_rsa) and the pinned server host key
        (file known_hosts, e.g. the output of ssh-keyscan checked by a human). Required for
        ssh-build, docker-compose and rsync. Host keys are always verified.
      optional: true
    - name: kubeconfig
      description: Workspace containing kubeconfig file at path config (for k8s/helm). Without it the in-cluster ServiceAccount is used.
      optional: true
    - name: aws-credentials
      description: Workspace containing AWS credentials file at path credentials (for s3-cloudfront)
      optional: true

  results:
    - name: deploy-status
      description: Status of the deployment (success; a failed deploy fails the Task)
    - name: deploy-url
      description: URL of the deployed application (if detectable)

  steps:
    - name: deploy
      image: alpine:3.24.3
      workingDir: $(workspaces.source.path)
      # All params reach the script through env, never by text substitution, so a
      # value coming from a webhook cannot inject shell code.
      env:
        - name: TARGET
          value: $(params.deploy-target)
        - name: IMAGE
          value: $(params.image)
        - name: SSH_HOST
          value: $(params.ssh-host)
        - name: SSH_USER
          value: $(params.ssh-user)
        - name: SSH_PORT
          value: $(params.ssh-port)
        - name: REMOTE_DIR
          value: $(params.remote-dir)
        - name: COMPOSE_FILE
          value: $(params.compose-file)
        - name: COMPOSE_SERVICE
          value: $(params.compose-service)
        - name: K8S_NAMESPACE
          value: $(params.k8s-namespace)
        - name: K8S_DEPLOYMENT
          value: $(params.k8s-deployment)
        - name: K8S_CONTAINER
          value: $(params.k8s-container)
        - name: K8S_MANIFESTS_PATH
          value: $(params.k8s-manifests-path)
        - name: HELM_RELEASE
          value: $(params.helm-release)
        - name: HELM_CHART
          value: $(params.helm-chart)
        - name: HELM_NAMESPACE
          value: $(params.helm-namespace)
        - name: HELM_VALUES_FILE
          value: $(params.helm-values-file)
        - name: HELM_EXTRA_ARGS
          value: $(params.helm-extra-args)
        - name: S3_BUCKET
          value: $(params.s3-bucket)
        - name: S3_SOURCE_PATH
          value: $(params.s3-source-path)
        - name: CLOUDFRONT_DISTRIBUTION_ID
          value: $(params.cloudfront-distribution-id)
        - name: AWS_REGION
          value: $(params.aws-region)
        - name: RSYNC_SOURCE_PATH
          value: $(params.rsync-source-path)
        - name: RSYNC_EXTRA_ARGS
          value: $(params.rsync-extra-args)
        - name: SSH_BOUND
          value: $(workspaces.ssh-credentials.bound)
        - name: SSH_DIR
          value: $(workspaces.ssh-credentials.path)
        - name: KUBECONFIG_BOUND
          value: $(workspaces.kubeconfig.bound)
        - name: KUBECONFIG_DIR
          value: $(workspaces.kubeconfig.path)
        - name: AWS_BOUND
          value: $(workspaces.aws-credentials.bound)
        - name: AWS_DIR
          value: $(workspaces.aws-credentials.path)
        - name: HOME
          value: /tmp/deploy-home
      script: |
        #!/bin/sh
        set -eu

        SRC=$(pwd)
        mkdir -p "$HOME"

        # Reject anything but plain identifiers/paths/refs in values that end up inside a
        # remote shell command. $2=1 also allows spaces (for argument lists).
        safe() {
          case "$2" in
            *[!A-Za-z0-9._/:@=+,-]*)
              if [ "${3:-0}" = "1" ]; then
                case "$2" in *[!A-Za-z0-9._/:@=+,\ -]*) echo "ERROR: unsafe characters in $1" >&2; exit 1 ;; esac
              else
                echo "ERROR: unsafe characters in $1" >&2; exit 1
              fi
              ;;
          esac
        }
        safe image "$IMAGE"
        safe ssh-host "$SSH_HOST"
        safe ssh-user "$SSH_USER"
        safe ssh-port "$SSH_PORT"
        safe remote-dir "$REMOTE_DIR"
        safe compose-file "$COMPOSE_FILE"
        safe compose-service "$COMPOSE_SERVICE"
        safe helm-extra-args "$HELM_EXTRA_ARGS" 1
        safe rsync-extra-args "$RSYNC_EXTRA_ARGS" 1

        # Sets up ssh with a pinned host key. Fails when the workspace or known_hosts is missing.
        ssh_setup() {
          if [ "$SSH_BOUND" != "true" ] || [ ! -f "$SSH_DIR/id_rsa" ] || [ ! -f "$SSH_DIR/known_hosts" ]; then
            echo "ERROR: ssh-credentials workspace needs id_rsa and known_hosts for target=$TARGET" >&2
            exit 1
          fi
          apk add --no-cache openssh-client >/dev/null
          mkdir -p "$HOME/.ssh"
          cp "$SSH_DIR/id_rsa" "$HOME/.ssh/id_rsa"
          cp "$SSH_DIR/known_hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa"
          SSH_OPTS="-p $SSH_PORT -i $HOME/.ssh/id_rsa -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
        }

        use_kubeconfig() {
          if [ "$KUBECONFIG_BOUND" = "true" ]; then
            export KUBECONFIG="$KUBECONFIG_DIR/config"
          fi
        }

        echo "==> Deploying with target=$TARGET"

        case "$TARGET" in

          ssh-build)
            ssh_setup
            # Values are validated by safe(); expanding them on the client side is intended.
            # shellcheck disable=SC2086,SC2029
            ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
              "set -e; cd $REMOTE_DIR; docker pull $IMAGE; docker rm -f app >/dev/null 2>&1 || true; docker run -d --name app --restart unless-stopped $IMAGE"
            URL="http://$SSH_HOST"
            ;;

          docker-compose)
            ssh_setup
            # Values are validated by safe(); expanding them on the client side is intended.
            # shellcheck disable=SC2086,SC2029
            ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
              "set -e; cd $REMOTE_DIR; export IMAGE=$IMAGE; docker compose -f $COMPOSE_FILE pull $COMPOSE_SERVICE; docker compose -f $COMPOSE_FILE up -d --no-deps $COMPOSE_SERVICE; docker compose -f $COMPOSE_FILE ps"
            URL="http://$SSH_HOST"
            ;;

          k8s)
            apk add --no-cache kubectl >/dev/null
            use_kubeconfig
            if [ -n "$K8S_MANIFESTS_PATH" ] && [ -d "$SRC/$K8S_MANIFESTS_PATH" ]; then
              echo "==> Applying manifests from $SRC/$K8S_MANIFESTS_PATH"
              kubectl apply -f "$SRC/$K8S_MANIFESTS_PATH" -n "$K8S_NAMESPACE"
            else
              echo "==> kubectl set image deployment/$K8S_DEPLOYMENT"
              kubectl set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE" -n "$K8S_NAMESPACE"
            fi
            if [ -n "$K8S_DEPLOYMENT" ]; then
              kubectl rollout status "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=300s
            fi
            URL=""
            ;;

          helm)
            apk add --no-cache helm >/dev/null
            use_kubeconfig
            case "${IMAGE##*/}" in
              *:*) REPO="${IMAGE%:*}"; TAG="${IMAGE##*:}" ;;
              *)   REPO="$IMAGE"; TAG="latest" ;;
            esac
            set -- --set "image.repository=$REPO" --set "image.tag=$TAG"
            if [ -f "$SRC/$HELM_VALUES_FILE" ]; then
              set -- "$@" -f "$SRC/$HELM_VALUES_FILE"
            fi
            # $HELM_EXTRA_ARGS is a validated, space separated list of extra flags.
            # shellcheck disable=SC2086
            helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
              --namespace "$HELM_NAMESPACE" --create-namespace \
              --wait --timeout 5m "$@" $HELM_EXTRA_ARGS
            URL=""
            ;;

          s3-cloudfront)
            apk add --no-cache aws-cli >/dev/null
            if [ "$AWS_BOUND" = "true" ]; then
              export AWS_SHARED_CREDENTIALS_FILE="$AWS_DIR/credentials"
            fi
            export AWS_DEFAULT_REGION="$AWS_REGION"
            echo "==> Syncing $SRC/$S3_SOURCE_PATH to s3://$S3_BUCKET"
            aws s3 sync "$SRC/$S3_SOURCE_PATH" "s3://$S3_BUCKET" --delete \
              --cache-control "public,max-age=31536000,immutable"
            if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
              echo "==> Invalidating CloudFront distribution $CLOUDFRONT_DISTRIBUTION_ID"
              aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
            fi
            URL="https://$S3_BUCKET.s3.amazonaws.com"
            ;;

          rsync)
            ssh_setup
            apk add --no-cache rsync >/dev/null
            # $RSYNC_EXTRA_ARGS is a validated, space separated list of extra flags.
            # shellcheck disable=SC2086
            rsync -az -e "ssh $SSH_OPTS" $RSYNC_EXTRA_ARGS \
              "$SRC/$RSYNC_SOURCE_PATH/" "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
            URL="http://$SSH_HOST"
            ;;

          *)
            echo "ERROR: unknown deploy-target '$TARGET'" >&2
            echo "Valid values: ssh-build | docker-compose | k8s | helm | s3-cloudfront | rsync" >&2
            exit 1
            ;;
        esac

        echo "==> Deployment complete"
        printf '%s' "$URL" > "$(results.deploy-url.path)"
        printf 'success' > "$(results.deploy-status.path)"
      computeResources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
