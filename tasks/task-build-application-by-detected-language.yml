apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-application
  labels:
    app.kubernetes.io/part-of: auto-pipeline
spec:
  description: |
    Builds the application with the toolchain image chosen by the detect-language task
    (builder-image), so npm, mvn, go, cargo, composer and pip really exist in the step.
    Supports: node (npm/yarn/pnpm), java (maven/gradle), go, python (pip/poetry),
    php (composer), rust (cargo). An unknown language fails the task instead of
    pretending the build worked.
  params:
    - name: builder-image
      description: Image with the toolchain for the detected language (result of detect-language)
      type: string
    - name: language
      description: Language detected by detect-language task
      type: string
    - name: build-tool
      description: Build tool detected by detect-language task
      type: string
    - name: extra-build-args
      description: Additional build arguments appended to the build command, one per array item
      type: array
      default: []
  workspaces:
    - name: source
      description: Workspace with cloned source code
    - name: cache
      description: Optional cache workspace for dependencies
      optional: true
  results:
    - name: build-status
      description: Status of the build (success)
    - name: artifact-path
      description: Path to the built artifact within the workspace
  steps:
    - name: build
      image: $(params.builder-image)
      workingDir: $(workspaces.source.path)
      # Params go through env, never straight into the script, so a branch name or
      # extra arg coming from a webhook cannot inject shell code.
      env:
        - name: LANGUAGE
          value: $(params.language)
        - name: BUILD_TOOL
          value: $(params.build-tool)
        - name: GOPATH
          value: /workspace/go
        - name: GOCACHE
          value: /workspace/go-cache
        - name: npm_config_cache
          value: /workspace/npm-cache
        - name: MAVEN_OPTS
          value: "-Dmaven.repo.local=/workspace/maven-cache"
      args: ["$(params.extra-build-args[*])"]
      script: |
        #!/bin/sh
        set -eu

        echo "==> Building: language=$LANGUAGE build-tool=$BUILD_TOOL"

        # "$@" holds the extra args (one per array item).
        case "$LANGUAGE" in
          node)
            case "$BUILD_TOOL" in
              pnpm)
                npm install -g pnpm
                pnpm install --frozen-lockfile
                pnpm run build "$@"
                ;;
              yarn)
                npm install -g yarn
                yarn install --frozen-lockfile
                yarn build "$@"
                ;;
              *)
                npm ci
                npm run build -- "$@"
                ;;
            esac
            ARTIFACT="dist"
            [ -d "build" ] && ARTIFACT="build"
            [ -d ".next" ] && ARTIFACT=".next"
            [ -d "out" ] && ARTIFACT="out"
            ;;

          java)
            case "$BUILD_TOOL" in
              gradle)
                if [ -f ./gradlew ]; then
                  sh ./gradlew build -x test "$@"
                else
                  gradle build -x test "$@"
                fi
                ARTIFACT="build/libs"
                ;;
              *)
                mvn --batch-mode package -DskipTests "$@"
                ARTIFACT="target"
                ;;
            esac
            ;;

          go)
            go build -o app "$@" .
            ARTIFACT="app"
            ;;

          python)
            case "$BUILD_TOOL" in
              poetry)
                pip install poetry
                poetry install --only main
                poetry build "$@"
                ARTIFACT="dist"
                ;;
              *)
                if [ -f requirements.txt ]; then
                  pip install -r requirements.txt "$@"
                fi
                ARTIFACT="."
                ;;
            esac
            ;;

          php)
            composer install --no-dev --optimize-autoloader "$@"
            ARTIFACT="."
            ;;

          rust)
            cargo build --release "$@"
            ARTIFACT="target/release"
            ;;

          *)
            echo "ERROR: cannot build unknown language '$LANGUAGE'" >&2
            exit 1
            ;;
        esac

        echo "==> Build complete. Artifact: $ARTIFACT"
        printf 'success' > "$(results.build-status.path)"
        printf '%s' "$ARTIFACT" > "$(results.artifact-path.path)"
      computeResources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
